name: Deploy API to Azure Functions

# Manual only, on purpose — this repo's standing rule is that deployment is
# an explicit, asked-for action, never an automatic side effect of pushing
# to master.
on:
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: pdfloom-api-tegminestar
  AZURE_RESOURCE_GROUP: pdfloom-rg
  AZURE_LOCATION: eastus
  AZURE_STORAGE_ACCOUNT: pdfloomapitegminestar

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # A real typecheck gate before anything gets provisioned or deployed.
      # Installing the whole workspace via pnpm (this repo's actual package
      # manager, matching the committed lockfile) after npm consistently
      # 401'd against the public registry on this runner — confirmed
      # across 5 retries with registry/auth explicitly forced, so it
      # wasn't a config issue on our end; pnpm's installer takes a
      # different request path and doesn't hit the same failure.
      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Typecheck apps/api
        run: pnpm --filter @pdfloom/api run typecheck

      # Build a standalone, ready-to-run deploy package rather than
      # trusting Azure's remote Oryx build: the first real deploy attempt
      # failed at "sync triggers" with an explicit WEBSITE_RUN_FROM_PACKAGE
      # complaint — Linux Consumption Function Apps default to expecting
      # an already-built, self-contained package, not source that needs a
      # build step after upload. `pnpm deploy` resolves the workspace's
      # symlinked node_modules into a real, flat layout (required — the
      # Azure Node runtime can't follow pnpm's symlinks/virtual store),
      # production dependencies only.
      - name: Build apps/api and package it for deployment
        run: |
          pnpm --filter @pdfloom/api run build
          pnpm --filter @pdfloom/api deploy --prod ./api-deploy-package
          ls -la ./api-deploy-package ./api-deploy-package/dist/functions

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ensure resource group exists
        run: |
          az group create \
            --name "$AZURE_RESOURCE_GROUP" \
            --location "$AZURE_LOCATION" \
            --output none

      - name: Ensure storage account exists
        run: |
          if ! az storage account show --name "$AZURE_STORAGE_ACCOUNT" --resource-group "$AZURE_RESOURCE_GROUP" --output none 2>/dev/null; then
            az storage account create \
              --name "$AZURE_STORAGE_ACCOUNT" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --location "$AZURE_LOCATION" \
              --sku Standard_LRS \
              --output none
          fi

      - name: Ensure Function App exists (Consumption plan — free tier covers this app's traffic)
        run: |
          if ! az functionapp show --name "$AZURE_FUNCTIONAPP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --output none 2>/dev/null; then
            az functionapp create \
              --name "$AZURE_FUNCTIONAPP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --storage-account "$AZURE_STORAGE_ACCOUNT" \
              --consumption-plan-location "$AZURE_LOCATION" \
              --runtime node \
              --runtime-version 24 \
              --functions-version 4 \
              --os-type Linux \
              --output none
          fi

      - name: Configure app settings (Stripe/Supabase secrets, never written to the repo)
        run: |
          az functionapp config appsettings set \
            --name "$AZURE_FUNCTIONAPP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --settings \
              STRIPE_SECRET_KEY="${{ secrets.STRIPE_SECRET_KEY }}" \
              STRIPE_WEBHOOK_SECRET="${{ secrets.STRIPE_WEBHOOK_SECRET }}" \
              STRIPE_PRO_PRICE_ID="${{ secrets.STRIPE_PRO_PRICE_ID }}" \
              SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
              SUPABASE_SERVICE_ROLE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
              APP_URL="${{ secrets.APP_URL }}" \
            --output none

      - name: Enable CORS for the web app's origin
        run: |
          az functionapp cors add \
            --name "$AZURE_FUNCTIONAPP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --allowed-origins "${{ secrets.APP_URL }}" \
            --output none || true

      - name: Deploy
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ./api-deploy-package
          scm-do-build-during-deployment: false

      - name: Print the deployed URL
        run: |
          echo "Function App URL: https://$AZURE_FUNCTIONAPP_NAME.azurewebsites.net"
          echo "Webhook endpoint to register in Stripe: https://$AZURE_FUNCTIONAPP_NAME.azurewebsites.net/api/stripe/webhook"

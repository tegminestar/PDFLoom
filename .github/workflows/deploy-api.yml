name: Deploy API to Azure App Service

# Manual only, on purpose — this repo's standing rule is that deployment is
# an explicit, asked-for action, never an automatic side effect of pushing
# to master.
on:
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: pdfloom-api-tegminestar
  AZURE_RESOURCE_GROUP: pdfloom-rg
  # The resource group itself already exists in eastus (from the earlier
  # Functions attempt) and a group's location can't be changed after
  # creation — but resources *inside* it can be in a different region, and
  # eastus has 0 quota for Free-tier (F1) App Service plans on this
  # subscription while westus2 does, so the plan/app use that instead.
  AZURE_LOCATION: eastus
  AZURE_APP_LOCATION: westus2
  AZURE_PLAN_NAME: pdfloom-api-plan

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # A real typecheck gate before anything gets provisioned or deployed.
      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Security audit
        # GHSA-w3rx-r6r6-pgpr / GHSA-5p2g-fcmc-qvqq: image-size DoS parsers,
        # pulled in transitively via apps/web's pptxgenjs. No patched
        # version exists upstream yet; not exploitable here since that path
        # only ever feeds it PNGs this app renders itself (see the note by
        # the pptxgenjs import in apps/web/src/features/quick-create/export.ts).
        # Remove the --ignore flags once image-size ships a fix.
        run: pnpm audit --audit-level high --ignore GHSA-w3rx-r6r6-pgpr --ignore GHSA-5p2g-fcmc-qvqq

      - name: Typecheck apps/api
        run: pnpm --filter @pdfloom/api run typecheck

      # Build a standalone, ready-to-run deploy package. `pnpm deploy`'s
      # default output still uses pnpm's own .pnpm virtual store internally
      # even with --legacy (symlinks node_modules/<pkg> -> .pnpm/<pkg>@ver);
      # --config.node-linker=hoisted forces genuine flat, real-file copies
      # instead — required here since the deploy package gets zipped and
      # unzipped by Azure's pipeline, and most zip/unzip tools don't
      # reliably preserve symlinks (the prime suspect for the container's
      # exit-code-1 crash: `require('express')` failing on a broken link
      # would explain a startup-time crash this fast).
      - name: Build apps/api and package it for deployment
        run: |
          pnpm --filter @pdfloom/api run build
          pnpm --filter @pdfloom/api deploy --prod --legacy --config.node-linker=hoisted ./api-deploy-package
          ls -la ./api-deploy-package ./api-deploy-package/dist
          echo "--- node_modules top level (checking for symlinks: 'l' in the permissions column) ---"
          ls -la ./api-deploy-package/node_modules | head -20
          node -e "console.log(require.resolve('express', {paths:['./api-deploy-package/node_modules']}))"

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ensure resource group exists
        run: |
          az group create \
            --name "$AZURE_RESOURCE_GROUP" \
            --location "$AZURE_LOCATION" \
            --output none

      - name: Ensure App Service plan exists (Free F1 tier — $0/month)
        run: |
          if ! az appservice plan show --name "$AZURE_PLAN_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --output none 2>/dev/null; then
            az appservice plan create \
              --name "$AZURE_PLAN_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --location "$AZURE_APP_LOCATION" \
              --is-linux \
              --sku F1 \
              --output none
          fi

      - name: Ensure Web App exists
        run: |
          if ! az webapp show --name "$AZURE_WEBAPP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --output none 2>/dev/null; then
            az webapp create \
              --name "$AZURE_WEBAPP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --plan "$AZURE_PLAN_NAME" \
              --runtime "NODE:24-lts" \
              --output none
          fi

      - name: Configure app settings and startup command (secrets never written to the repo)
        run: |
          az webapp config appsettings set \
            --name "$AZURE_WEBAPP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --settings \
              STRIPE_SECRET_KEY="${{ secrets.STRIPE_SECRET_KEY }}" \
              STRIPE_WEBHOOK_SECRET="${{ secrets.STRIPE_WEBHOOK_SECRET }}" \
              STRIPE_PRO_PRICE_ID="${{ secrets.STRIPE_PRO_PRICE_ID }}" \
              SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
              SUPABASE_SERVICE_ROLE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
              APP_URL="${{ secrets.APP_URL }}" \
              SCM_DO_BUILD_DURING_DEPLOYMENT=false \
              WEBSITE_NODE_DEFAULT_VERSION=~24 \
            --output none
          az webapp config set \
            --name "$AZURE_WEBAPP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --startup-file "node dist/server.js" \
            --output none

      - id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./api-deploy-package

      - name: Print the deployed URL
        run: |
          echo "API URL: https://$AZURE_WEBAPP_NAME.azurewebsites.net"
          echo "Health check: https://$AZURE_WEBAPP_NAME.azurewebsites.net/api/health"
          echo "Webhook endpoint to register in Stripe: https://$AZURE_WEBAPP_NAME.azurewebsites.net/api/stripe/webhook"

      - name: Wait, then check health and pull recent application logs
        run: |
          sleep 30
          echo "--- downloaded log zip contents ---"
          az webapp log download --name "$AZURE_WEBAPP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --log-file logs.zip 2>&1 || true
          if [ -f logs.zip ]; then
            unzip -o -q logs.zip -d logs_unzipped
            find logs_unzipped -type f -name "*docker*" -exec sh -c 'echo "=== {} ==="; cat "{}"' \;
          fi
          echo "--- health check ---"
          curl -s -w "\nSTATUS:%{http_code}\n" "https://$AZURE_WEBAPP_NAME.azurewebsites.net/api/health" --max-time 30 || true
          echo "--- recent log stream (15s) ---"
          timeout 15 az webapp log tail --name "$AZURE_WEBAPP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" || true

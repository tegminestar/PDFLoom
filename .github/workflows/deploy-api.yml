name: Deploy API to Azure App Service

# Manual only, on purpose — this repo's standing rule is that deployment is
# an explicit, asked-for action, never an automatic side effect of pushing
# to master.
on:
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: pdfloom-api-tegminestar
  AZURE_RESOURCE_GROUP: pdfloom-rg
  AZURE_LOCATION: westus2
  AZURE_PLAN_NAME: pdfloom-api-plan
  # Left over from an earlier Azure Functions attempt (see git history) —
  # Functions needed a storage account and its own Dynamic/Consumption
  # plan; a plain Express app on App Service needs neither, so this
  # workflow tears those down the first time it runs.
  LEGACY_FUNCTIONAPP_NAME: pdfloom-api-tegminestar
  LEGACY_STORAGE_ACCOUNT: pdfloomapitegminestar

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # A real typecheck gate before anything gets provisioned or deployed.
      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Typecheck apps/api
        run: pnpm --filter @pdfloom/api run typecheck

      # Build a standalone, ready-to-run deploy package — `pnpm deploy`
      # resolves the workspace's symlinked node_modules into a real, flat
      # layout (required for any non-pnpm-aware runtime), production
      # dependencies only. --legacy: apps/api has no workspace: deps of its
      # own to inject, so pnpm's newer injected-workspace mode isn't needed.
      - name: Build apps/api and package it for deployment
        run: |
          pnpm --filter @pdfloom/api run build
          pnpm --filter @pdfloom/api deploy --prod --legacy ./api-deploy-package
          ls -la ./api-deploy-package ./api-deploy-package/dist

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Remove leftover Azure Functions resources from an earlier attempt
        run: |
          az functionapp delete --name "$LEGACY_FUNCTIONAPP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" 2>/dev/null || true
          az storage account delete --name "$LEGACY_STORAGE_ACCOUNT" --resource-group "$AZURE_RESOURCE_GROUP" --yes 2>/dev/null || true
          # The Function App's auto-created Consumption plan — safe to
          # delete once nothing references it; ignored if already gone or
          # still in use by something else.
          for plan in $(az appservice plan list --resource-group "$AZURE_RESOURCE_GROUP" --query "[?sku.tier=='Dynamic'].name" -o tsv 2>/dev/null || true); do
            az appservice plan delete --name "$plan" --resource-group "$AZURE_RESOURCE_GROUP" --yes 2>/dev/null || true
          done

      - name: Ensure resource group exists
        run: |
          az group create \
            --name "$AZURE_RESOURCE_GROUP" \
            --location "$AZURE_LOCATION" \
            --output none

      - name: Ensure App Service plan exists (Free F1 tier — $0/month)
        run: |
          if ! az appservice plan show --name "$AZURE_PLAN_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --output none 2>/dev/null; then
            az appservice plan create \
              --name "$AZURE_PLAN_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --location "$AZURE_LOCATION" \
              --is-linux \
              --sku F1 \
              --output none
          fi

      - name: Ensure Web App exists
        run: |
          if ! az webapp show --name "$AZURE_WEBAPP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --output none 2>/dev/null; then
            az webapp create \
              --name "$AZURE_WEBAPP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --plan "$AZURE_PLAN_NAME" \
              --runtime "NODE:24-lts" \
              --output none
          fi

      - name: Configure app settings and startup command (secrets never written to the repo)
        run: |
          az webapp config appsettings set \
            --name "$AZURE_WEBAPP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --settings \
              STRIPE_SECRET_KEY="${{ secrets.STRIPE_SECRET_KEY }}" \
              STRIPE_WEBHOOK_SECRET="${{ secrets.STRIPE_WEBHOOK_SECRET }}" \
              STRIPE_PRO_PRICE_ID="${{ secrets.STRIPE_PRO_PRICE_ID }}" \
              SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
              SUPABASE_SERVICE_ROLE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
              APP_URL="${{ secrets.APP_URL }}" \
              SCM_DO_BUILD_DURING_DEPLOYMENT=false \
              WEBSITE_NODE_DEFAULT_VERSION=~24 \
            --output none
          az webapp config set \
            --name "$AZURE_WEBAPP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --startup-file "node dist/server.js" \
            --output none

      - id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./api-deploy-package

      - name: Print the deployed URL
        run: |
          echo "API URL: https://$AZURE_WEBAPP_NAME.azurewebsites.net"
          echo "Health check: https://$AZURE_WEBAPP_NAME.azurewebsites.net/api/health"
          echo "Webhook endpoint to register in Stripe: https://$AZURE_WEBAPP_NAME.azurewebsites.net/api/stripe/webhook"

name: Build Desktop Installers and Publish a GitHub Release

# Manual only, on purpose — same standing rule as deploy-api.yml and
# deploy-web.yml: a release is an explicit, asked-for action, never an
# automatic side effect of pushing to master. The version input becomes the
# git tag (v<version>) and the release title — but tauri-action separately
# reads the *actual bundle* version from src-tauri/tauri.conf.json (and
# expects it to match src-tauri/Cargo.toml and package.json too), so this
# input does NOT replace bumping those files first. Get that wrong and
# tauri-action silently falls back to creating an "untagged-<hash>" release
# instead of the one you asked for (discovered the hard way: this file used
# to claim the opposite). The "Verify version consistency" step below fails
# fast if they ever drift again.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.0 (becomes tag v0.1.0)"
        required: true
        default: "0.1.0"

# The default GITHUB_TOKEN's contents permission is read-only on this repo,
# which failed the very first real create-release call with "Resource not
# accessible by integration" — needs write explicitly for tauri-action to
# create the tag/release and upload installers to it.
permissions:
  contents: write

env:
  # Same live backend the web deploy points at — the desktop build's
  # account/billing UI needs this baked in at build time (Vite inlines
  # import.meta.env.*), same reasoning as deploy-web.yml. Core PDF editing
  # itself needs none of these.
  VITE_API_URL: https://pdfloom-api-tegminestar.azurewebsites.net

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Universal binary covers both Apple Silicon and Intel Macs from
          # one build, at the cost of compiling twice — worth it so there's
          # a single download rather than asking users to know their chip.
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          # 22.04, not "ubuntu-latest" — Tauri's own guidance: building
          # against an older glibc keeps the resulting .deb/.AppImage
          # compatible with more users' systems than the newest LTS would.
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # Fails fast (before ~8+ minutes of Rust compilation) if the version
      # bumped into tauri.conf.json/Cargo.toml/package.json doesn't match
      # what was typed into the workflow_dispatch input — a mismatch here
      # doesn't fail the build, it makes tauri-action silently create an
      # "untagged-<hash>" release instead of tag v<version>, which is far
      # more confusing to discover after three platforms finish building.
      - name: Verify version consistency
        shell: bash
        run: |
          input_version="${{ github.event.inputs.version }}"
          # [[:space:]] not \s — macOS ships BSD sed, which (unlike GNU sed
          # on Linux and Git Bash's sed on Windows runners) doesn't support
          # \s as a whitespace shorthand; \s silently failed to match there,
          # so the substitution left the whole line — "version": "0.1.2", —
          # untouched, which then obviously never equal-compared to a bare
          # version string, permanently failing this check on macOS
          # specifically. Caught by actually running this workflow, since
          # there's no macOS shell available to test it in beforehand.
          tauri_conf_version=$(grep -m1 '"version"' apps/desktop/src-tauri/tauri.conf.json | sed -E 's/.*"version":[[:space:]]*"([^"]*)".*/\1/')
          package_json_version=$(grep -m1 '"version"' apps/desktop/package.json | sed -E 's/.*"version":[[:space:]]*"([^"]*)".*/\1/')
          cargo_toml_version=$(grep -m1 '^version' apps/desktop/src-tauri/Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          echo "workflow input: $input_version"
          echo "tauri.conf.json: $tauri_conf_version"
          echo "package.json: $package_json_version"
          echo "Cargo.toml: $cargo_toml_version"
          if [ "$input_version" != "$tauri_conf_version" ] || [ "$input_version" != "$package_json_version" ] || [ "$input_version" != "$cargo_toml_version" ]; then
            echo "::error::Version mismatch — bump apps/desktop/src-tauri/tauri.conf.json, apps/desktop/src-tauri/Cargo.toml, and apps/desktop/package.json to $input_version (and commit it) before re-running this workflow."
            exit 1
          fi

      # libayatana-appindicator3-dev is Tauri v2's actual requirement on
      # modern Ubuntu — NOT libappindicator3-dev (that's the Tauri
      # v1-era/older package, and jammy's package manager refuses to
      # install both at once since they conflict).
      - name: Install Linux system dependencies (webkit2gtk etc.)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      # Runs `tauri build` (which itself shells out to tauri.conf.json's
      # beforeBuildCommand to build apps/web first) and, since a
      # GITHUB_TOKEN + tagName are given, creates/updates a single draft
      # GitHub Release and uploads each platform's installers to it — left
      # as a draft deliberately so the actual artifacts can be checked
      # before anyone sees a public release.
      # TAURI_SIGNING_PRIVATE_KEY signs the update bundle tauri-action
      # produces (bundle.createUpdaterArtifacts in tauri.conf.json) — without
      # it, `tauri build` silently skips generating .sig files and the
      # updater plugin has nothing valid to verify against. Note the
      # updater's endpoint (tauri.conf.json's plugins.updater.endpoints)
      # points at .../releases/latest/download/latest.json, and GitHub's
      # "latest" release excludes drafts — installed apps won't see this (or
      # any) release as an update until it's published, not left as a draft.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: v${{ github.event.inputs.version }}
          releaseName: "PDFLoom v${{ github.event.inputs.version }}"
          releaseBody: |
            First public desktop build of PDFLoom. Works fully offline once installed; AI features download their model on first use.

            These installers are not code-signed (no paid certificate yet):
            - **Windows**: SmartScreen will warn on first run — click "More info" → "Run anyway".
            - **macOS**: Gatekeeper will block it — right-click the app → "Open" the first time, or allow it in System Settings → Privacy & Security.
            - **Linux**: no equivalent warning.

            No install needed at all? The same app runs at https://happy-smoke-002c10c1e.3.azurestaticapps.net
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

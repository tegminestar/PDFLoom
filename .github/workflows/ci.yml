name: CI

# Runs on every push and pull request, unlike the deploy workflows (which
# are manual-only, on purpose) — this is the actual change-management gate:
# nothing merges without passing audit, lint, and typecheck first.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Security audit
        # GHSA-w3rx-r6r6-pgpr / GHSA-5p2g-fcmc-qvqq: image-size DoS parsers,
        # pulled in transitively via apps/web's pptxgenjs. No patched
        # version exists upstream yet; not exploitable here since that path
        # only ever feeds it PNGs this app renders itself (see the note by
        # the pptxgenjs import in apps/web/src/features/quick-create/export.ts).
        # Remove the --ignore flags once image-size ships a fix.
        run: pnpm audit --audit-level high --ignore GHSA-w3rx-r6r6-pgpr --ignore GHSA-5p2g-fcmc-qvqq

      - name: Lint
        run: pnpm lint

      # apps/web's own `tsc -b` only typechecks its own src (packages/core
      # and packages/ui are consumed as raw TS source via moduleResolution
      # "bundler", not a separate build), so it alone won't catch a
      # strict-mode issue inside those packages themselves — running each
      # package's own typecheck too closes that gap. Mirrors deploy-web.yml.
      - name: Typecheck packages/core, packages/ui, apps/api
        run: pnpm typecheck

      - name: Typecheck and build apps/web
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: pnpm --filter @pdfloom/web build

      - name: Test
        run: pnpm test

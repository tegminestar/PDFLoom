name: Configure Custom Domain

# Manual only, same standing rule as every other deploy/release workflow
# in this repo. Registers (or shows the current status of) a custom
# hostname on the Static Web App — the actual DNS records still have to
# be added at whatever registrar/DNS host owns the domain; this just
# tells you exactly what Azure wants.
on:
  workflow_dispatch:
    inputs:
      hostname:
        description: "Custom domain to add, e.g. pdfloom.app"
        required: true

permissions:
  contents: read

env:
  AZURE_RESOURCE_GROUP: pdfloom-rg
  AZURE_SWA_NAME: pdfloom-web

jobs:
  configure:
    runs-on: ubuntu-latest
    # Real safety net: `az staticwebapp hostname set` with TXT validation
    # turned out to block for 15+ minutes with no output at all (presumably
    # polling for a TXT record that can't exist yet, since this call is
    # what generates the token to put in it) — the `timeout` wrapper below
    # is the primary fix, this is a hard backstop in case that's not enough.
    timeout-minutes: 5
    steps:
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Default CNAME validation requires the DNS record to already resolve
      # to this Static Web App *before* Azure will accept the registration
      # — a chicken-and-egg problem for a first-time apex domain, and a
      # bare CNAME at a zone apex isn't valid DNS anyway. dns-txt-token
      # decouples "prove you own this domain" (a TXT record) from
      # "point traffic here" (the CNAME/ALIAS you add afterward). The
      # `set` call itself blocks waiting on validation rather than
      # returning the token immediately, so it's wrapped in `timeout` —
      # the hostname resource + its token exist as soon as the API call
      # lands regardless, so killing the CLI process after a short wait
      # and reading it back via a separate `hostname show` is safe.
      - name: Register the hostname if it isn't already
        run: |
          HOSTNAME="${{ github.event.inputs.hostname }}"
          if ! az staticwebapp hostname show --name "$AZURE_SWA_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --hostname "$HOSTNAME" --output none 2>/dev/null; then
            echo "--- registering $HOSTNAME (TXT validation) ---"
            timeout 60 az staticwebapp hostname set \
              --name "$AZURE_SWA_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --hostname "$HOSTNAME" \
              --validation-method dns-txt-token \
              --output none || echo "(set call didn't return within 60s — checking what was actually created below)"
          else
            echo "--- $HOSTNAME already registered ---"
          fi

      - name: Show its current status (the validation token, if pending)
        run: |
          az staticwebapp hostname show \
            --name "$AZURE_SWA_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --hostname "${{ github.event.inputs.hostname }}" \
            -o json

      - name: Print the Static Web App's own default hostname (what the apex record should point at)
        run: |
          az staticwebapp show --name "$AZURE_SWA_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query "defaultHostname" -o tsv

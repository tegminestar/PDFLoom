name: Configure API Custom Domain

# Manual only, same standing rule as every other deploy/release workflow in
# this repo. Registers (or shows the current status of) a custom hostname
# on the API's App Service. TLS is deliberately NOT handled here — this
# repo's App Service plan is Free tier (F1, see deploy-api.yml), and Azure's
# managed-certificate/SSL-binding feature has historically required a paid
# tier. Since pdfloom.app's DNS already lives on Cloudflare, the intended
# setup is Cloudflare terminating TLS at the edge (orange-cloud "Proxied"
# on the new record, SSL/TLS mode "Full") and forwarding to Azure's default
# *.azurewebsites.net certificate — "Full" mode only requires the origin to
# present *a* valid certificate, not one matching the requested hostname, so
# no Azure-side cert work is needed at all. Azure still needs the hostname
# registered so its host-header routing recognizes it instead of 404ing.
on:
  workflow_dispatch:
    inputs:
      hostname:
        description: "Custom domain for the API, e.g. api.pdfloom.app"
        required: true

permissions:
  contents: read

env:
  AZURE_RESOURCE_GROUP: pdfloom-rg
  AZURE_WEBAPP_NAME: pdfloom-api-tegminestar

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Job-level so every step below references $HOSTNAME as a real env var
    # rather than re-splicing the workflow_dispatch input straight into its
    # own script text — see configure-custom-domain.yml's identical note on
    # why that matters (a crafted input could otherwise break out of the
    # run: block and execute arbitrary commands with this job's
    # AZURE_CREDENTIALS access).
    env:
      HOSTNAME: ${{ github.event.inputs.hostname }}
    steps:
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Show the DNS records this hostname needs
        run: |
          VERIFY_ID=$(az webapp show --name "$AZURE_WEBAPP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query customDomainVerificationId -o tsv)
          DEFAULT_HOST=$(az webapp show --name "$AZURE_WEBAPP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query defaultHostName -o tsv)
          echo "Add these two records at your DNS provider (Cloudflare), then re-run this workflow:"
          echo ""
          echo "  Type: CNAME   Name: ${HOSTNAME%%.*}   Target: $DEFAULT_HOST   Proxy: Proxied (orange cloud)"
          echo "  Type: TXT     Name: asuid.$HOSTNAME   Value: $VERIFY_ID"
          echo ""
          echo "Also set Cloudflare's SSL/TLS mode to 'Full' (not 'Full strict') for this zone,"
          echo "since Azure's default certificate won't match the custom hostname by itself."

      - name: Register the hostname if it isn't already (fails until the DNS above has propagated)
        id: bind
        run: |
          if az webapp config hostname add \
            --webapp-name "$AZURE_WEBAPP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --hostname "$HOSTNAME" \
            --output none 2>bind-error.log; then
            echo "bound=true" >> "$GITHUB_OUTPUT"
          else
            echo "bound=false" >> "$GITHUB_OUTPUT"
            echo "--- hostname add did not succeed (expected until DNS above is live and propagated) ---"
            cat bind-error.log
          fi

      - name: Health check the new hostname (only if binding just succeeded)
        if: steps.bind.outputs.bound == 'true'
        run: |
          echo "Bound. Waiting a few seconds for it to take effect..."
          sleep 15
          curl -s -w "\nSTATUS:%{http_code}\n" "https://$HOSTNAME/api/health" --max-time 30 || true

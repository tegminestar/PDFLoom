[package]
name = "pdfloom-desktop"
version = "0.1.3"
description = "PDFLoom — a premium, AI-native PDF editor. 100% local, works offline."
authors = ["PDFLoom"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "pdfloom_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"

# Desktop-only: lets "Open With PDFLoom" on a second file redirect into the
# already-running instance instead of spawning a new window — mobile has no
# such concept, and the plugin doesn't support those targets.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

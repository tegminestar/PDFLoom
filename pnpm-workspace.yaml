packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  # This app is 100% browser/WASM — these packages' native Node addons are
  # never used (@huggingface/transformers only needs its browser bundle
  # here), so their install/build scripts stay disallowed.
  onnxruntime-node: false
  protobufjs: false
  sharp: false
  tesseract.js: true
  # Downloads the actual `func` CLI binary used to run Azure Functions
  # locally (apps/api's dev-only tooling, not shipped anywhere).
  azure-functions-core-tools: true

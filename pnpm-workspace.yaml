packages:
  - "apps/*"
  - "packages/*"
overrides:
  adm-zip: ">=0.6.0"
  sharp: ">=0.35.0"
  qs: ">=6.16.0"
  uuid: ">=11.1.1"
  # GHSA-mwp4-54f8-5fhr (high): geoip-lite pins an old ip-address@5.x with
  # an octal/decimal octet-parsing mismatch. geoip-lite only ever feeds it
  # an already-received request IP for an offline geo lookup — never an
  # address that gates a network request or an allow/blocklist decision —
  # so it's not exploitable here either way, but a real fix exists, so use it.
  ip-address: ">=10.3.1"
allowBuilds:
  # This app is 100% browser/WASM — these packages' native Node addons are
  # never used (@huggingface/transformers only needs its browser bundle
  # here), so their install/build scripts stay disallowed.
  onnxruntime-node: false
  protobufjs: false
  sharp: false
  tesseract.js: true
auditConfig:
  ignoreGhsas:
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq
minimumReleaseAgeExclude:
  - '@supabase/auth-js@2.114.0'
  - '@supabase/functions-js@2.114.0'
  - '@supabase/postgrest-js@2.114.0'
  - '@supabase/realtime-js@2.114.0'
  - '@supabase/storage-js@2.114.0'
  - '@supabase/supabase-js@2.114.0'
